name: Spring Boot CI with Docker & Git-Action

on:
  push:
    branches: ["feature/#25-ci-cd-pipeline"]
  pull_request:
    branches: ["feature/#25-ci-cd-pipeline"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: ci    # 스프링 프로필
    permissions:
      contents: read
      packages: write
      id-token: write

    defaults:
      run:
        working-directory: dockerEx/project   # 리포지토리 루트 기준 경로 조정

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (with Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'                     # Gradle 의존성 캐시 활성화
        # 참고: 더 강력한 Gradle 캐시는 gradle/actions/setup-gradle@v4를 함께 고려 [6][19]

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle (skip tests)
        run: ./gradlew clean bootJar -x test
        # 결과 JAR: dockerEx/project/build/libs/*.jar

      # Docker Buildx 준비
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: image=moby/buildkit:latest
        # 멀티플랫폼/캐시 빌드 용이 [7]

      # (옵션) DockerHub/GHCR 로그인
      # - name: Log in to DockerHub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: dockerEx/project            # Docker build 컨텍스트 지정 (루트 아님) [2][14]
          file: dockerEx/project/Dockerfile    # Dockerfile 경로 명시
          push: false                          # 레지스트리 푸시 비활성화(학습용 CI)
          tags: project-app:ci                 # 로컬 태그
          # 캐시 최적화 (선택)
          cache-from: type=gha                 # GitHub Actions 캐시 사용 [16]
          cache-to: type=gha,mode=max

      # (옵션) 이미지 실행 스모크 테스트
      # - name: Smoke test container
      #   run: |
      #     docker run --rm -p 8080:8080 project-app:ci \
      #       -e SPRING_PROFILES_ACTIVE=ci