# 기본 작업 디렉터리: 리포지토리 루트 기준 dockerEx/project
defaults:
  run:
    working-directory: dockerEx/project

steps:
  - name: Check out code
    uses: actions/checkout@v4

  - name: Set up JDK 17 (Gradle cache)
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
      cache: gradle

  - name: Make gradlew executable
    run: chmod +x ./gradlew

  - name: Build with Gradle (skip tests)
    run: ./gradlew clean bootJar -x test

  # 선택: 필요 시 테스트 실행을 별도 스텝으로 분리
  # - name: Run tests
  #   run: ./gradlew test

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3
    with:
      install: true
      driver-opts: image=moby/buildkit:latest


  # 선택: DockerHub 또는 GHCR 로그인 (레지스트리 푸시 시 활성화)
  # - name: Log in to DockerHub
  #   uses: docker/login-action@v3
  #   with:
  #     username: ${{ secrets.DOCKERHUB_USERNAME }}
  #     password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Build Docker image
    uses: docker/build-push-action@v6
    with:
      context: dockerEx/project
      file: dockerEx/project/Dockerfile
      push: false
      tags: project-app:ci
      cache-from: type=gha
      cache-to: type=gha,mode=max
      # 빌드시 프로파일 전달이 필요하면 build-args 사용 가능
      # build-args: |
      #   SPRING_PROFILES_ACTIVE=ci

  # 선택: 스모크 테스트(컨테이너 한 번 기동 후 헬스 체크)
  # - name: Smoke test container
  #   run: |
  #     docker run --rm -e SPRING_PROFILES_ACTIVE=ci -p 8080:8080 project-app:ci &
  #     sleep 10
  #     curl -f http://localhost:8080/actuator/health

  # 선택: 아티팩트 업로드 (빌드 산출물 보관)
